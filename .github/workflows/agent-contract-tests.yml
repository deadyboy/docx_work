name: agent-contract-tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile agent/*.py agent_cli.py llm_client.py llm_ollama.py
      - name: Router contract tests
        run: python -m unittest discover -s tests -v
